<svg xmlns="http://www.w3.org/2000/svg" width="1712" height="802" viewBox="0 0 1712 802"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="1712" height="802" rx="0" fill="#0a0a0a" stroke="none"/><rect x="12" y="28" width="1686" height="680" rx="8" fill="#0c150e" stroke="none"/><rect x="12" y="28" width="1686" height="190" rx="8" fill="#171717" stroke="none"/><rect x="12" y="218" width="1686" height="180" rx="0" fill="#0b1117" stroke="none"/><text x="41" y="84" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="41" dy="0">Your</tspan><tspan x="41" dy="22.1">platform</tspan></text><text x="41" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="41" dy="0">Search UI,</tspan><tspan x="41" dy="17">selection, checkout</tspan><tspan x="41" dy="17">&amp; success</tspan></text><text x="41" y="265" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="41" dy="0">Namify - API</tspan><tspan x="41" dy="22.1">&amp; coupon</tspan></text><text x="41" y="315" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="41" dy="0">Validates key,</tspan><tspan x="41" dy="17">issues coupon</tspan></text><text x="41" y="445" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="41" dy="0">Namify platform</tspan></text><text x="41" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="41" dy="0">Search,</tspan><tspan x="41" dy="17">checkout,</tspan><tspan x="41" dy="17">registration.</tspan></text><rect x="208" y="62" width="216" height="132" rx="5" fill="#131313" stroke="#191919"/><text x="222" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="222" dy="0">Search for a</tspan><tspan x="222" dy="22.1">domain</tspan></text><text x="222" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="222" dy="0">The user searches inside the</tspan><tspan x="222" dy="17">domain experience you have</tspan><tspan x="222" dy="17">built</tspan></text><rect x="389" y="71" width="26" height="27" rx="8" fill="#222222" stroke="none"/><text x="402.0" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f2f2f2" text-anchor="middle"><tspan x="402.0" dy="0">1.</tspan></text><rect x="445" y="62" width="216" height="132" rx="5" fill="#131313" stroke="#191919"/><text x="459" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="459" dy="0">User selects a</tspan><tspan x="459" dy="22.1">domain</tspan></text><text x="459" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="459" dy="0">You display the returned</tspan><tspan x="459" dy="17">options; the user picks one</tspan><tspan x="459" dy="17">and you store the selection</tspan></text><rect x="626" y="71" width="26" height="27" rx="8" fill="#222222" stroke="none"/><text x="639.0" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f2f2f2" text-anchor="middle"><tspan x="639.0" dy="0">2.</tspan></text><rect x="681" y="62" width="216" height="132" rx="5" fill="#131313" stroke="#191919"/><text x="695" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="695" dy="0">Create the user</tspan></text><text x="695" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="695" dy="0">You collect the required</tspan><tspan x="695" dy="17">user and registrant details in</tspan><tspan x="695" dy="17">your own UI.</tspan></text><rect x="862" y="71" width="26" height="27" rx="8" fill="#222222" stroke="none"/><text x="875.0" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f2f2f2" text-anchor="middle"><tspan x="875.0" dy="0">3.</tspan></text><rect x="918" y="62" width="216" height="132" rx="5" fill="#131313" stroke="#191919"/><text x="932" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="932" dy="0">You handle billing</tspan></text><text x="932" y="119" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="932" dy="0">The user pays through your</tspan><tspan x="932" dy="17">checkout. Complete payment</tspan><tspan x="932" dy="17">or card collection before</tspan><tspan x="932" dy="17">continuing.</tspan></text><rect x="1099" y="71" width="26" height="27" rx="8" fill="#222222" stroke="none"/><text x="1112.0" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f2f2f2" text-anchor="middle"><tspan x="1112.0" dy="0">4.</tspan></text><rect x="1453" y="62" width="216" height="132" rx="5" fill="#131313" stroke="#191919"/><text x="1467" y="92" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="1467" dy="0">Show registration</tspan><tspan x="1467" dy="22.1">success</tspan></text><text x="1467" y="141" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1467" dy="0">You store the order_id,</tspan><tspan x="1467" dy="17">associate the domain with the</tspan><tspan x="1467" dy="17">user, and confirm success.</tspan></text><rect x="1634" y="71" width="26" height="27" rx="8" fill="#222222" stroke="none"/><text x="1647.0" y="89" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#f2f2f2" text-anchor="middle"><tspan x="1647.0" dy="0">7.</tspan></text><rect x="335" y="240" width="217" height="134" rx="5" fill="#0c1218" stroke="#182b3b"/><text x="349" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#82bcff" text-anchor="start"><tspan x="349" dy="0">Meta Search</tspan></text><text x="349" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="349" dy="0">Returns availability,</tspan><tspan x="349" dy="17">pricing and optional AI</tspan><tspan x="349" dy="17">suggestions.</tspan></text><rect x="485" y="249" width="58" height="27" rx="8" fill="#101b27" stroke="none"/><text x="514.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#82bcff" text-anchor="middle"><tspan x="514.0" dy="0">API Call</tspan></text><rect x="755" y="240" width="181" height="134" rx="5" fill="#0c1218" stroke="#182b3b"/><text x="769" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#82bcff" text-anchor="start"><tspan x="769" dy="0">Create user</tspan></text><text x="769" y="297" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="769" dy="0">Namify creates the</tspan><tspan x="769" dy="17">account and returns</tspan><tspan x="769" dy="17">the user_id</tspan></text><rect x="869" y="249" width="58" height="27" rx="8" fill="#101b27" stroke="none"/><text x="898.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#82bcff" text-anchor="middle"><tspan x="898.0" dy="0">API Call</tspan></text><rect x="1000" y="240" width="181" height="134" rx="5" fill="#0c1218" stroke="#182b3b"/><text x="1014" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#82bcff" text-anchor="start"><tspan x="1014" dy="0">Check</tspan><tspan x="1014" dy="22.1">availability</tspan></text><text x="1014" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1014" dy="0">Confirms the domain is</tspan><tspan x="1014" dy="17">still available before</tspan><tspan x="1014" dy="17">your register</tspan></text><rect x="1114" y="249" width="58" height="27" rx="8" fill="#101b27" stroke="none"/><text x="1143.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#82bcff" text-anchor="middle"><tspan x="1143.0" dy="0">API Call</tspan></text><rect x="1198" y="240" width="181" height="134" rx="5" fill="#0c1218" stroke="#182b3b"/><text x="1212" y="270" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#82bcff" text-anchor="start"><tspan x="1212" dy="0">Register</tspan><tspan x="1212" dy="22.1">the domain</tspan></text><text x="1212" y="319" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1212" dy="0">Registers the domain</tspan><tspan x="1212" dy="17">against the stored</tspan><tspan x="1212" dy="17">user_id</tspan></text><rect x="1312" y="249" width="58" height="27" rx="8" fill="#101b27" stroke="none"/><text x="1341.0" y="267" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#82bcff" text-anchor="middle"><tspan x="1341.0" dy="0">API Call</tspan></text><rect x="1198" y="420" width="181" height="145" rx="5" fill="#0c170e" stroke="#17371c"/><text x="1212" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="1212" dy="0">Settlement &amp;</tspan><tspan x="1212" dy="22.1">registry</tspan></text><text x="1212" y="499" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1212" dy="0">Namify settles billing on</tspan><tspan x="1212" dy="17">our end, then submits the</tspan><tspan x="1212" dy="17">registration to the registry.</tspan></text><rect x="1423" y="420" width="246" height="145" rx="5" fill="#0c170e" stroke="#17371c"/><text x="1437" y="450" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="1437" dy="0">Post-Reg verification</tspan></text><text x="1437" y="477" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1437" dy="0">*RAA verification is triggered after</tspan><tspan x="1437" dy="17">registration. If completed within 14</tspan><tspan x="1437" dy="17">days, the domain remains active. If</tspan><tspan x="1437" dy="17">not, the domain is suspended until</tspan><tspan x="1437" dy="17">verification is completed.</tspan></text><rect x="1634" y="429" width="26" height="27" rx="8" fill="#112717" stroke="none"/><text x="1647.0" y="447" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#75f58b" text-anchor="middle"><tspan x="1647.0" dy="0">8.</tspan></text><rect x="1423" y="588" width="252" height="100" rx="5" fill="#0c170e" stroke="#17371c"/><text x="1437" y="618" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="1437" dy="0">Domain</tspan><tspan x="1437" dy="22.1">management</tspan></text><text x="1437" y="667" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="1437" dy="0">Handled by Namify.</tspan></text><path d="M307 195 V287 Q307 309 329 309 H335" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M552 309 Q573 309 573 288 V197" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M662 128 H679" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M714 195 V288 Q714 309 735 309 H755" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M936 309 H946 Q967 309 967 288 V197" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1134 120 Q1154 120 1154 140 V238" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1181 313 H1198" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1288 374 V420" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1379 488 Q1404 488 1404 464 V158 Q1404 136 1426 136 H1452" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1154 120 V60 Q1154 38 1132 38 H603 Q581 38 581 60" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M1550 195 V420" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M1549 565 V587" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="13" y="741" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="13" dy="0">Legends</tspan></text><path d="M13 763 H38" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="48" y="768" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="48" dy="0">Backend call</tspan></text><path d="M13 785 H38" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><text x="48" y="790" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="48" dy="0">User movement</tspan></text></svg>