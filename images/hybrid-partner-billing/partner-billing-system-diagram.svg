<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="818" viewBox="0 0 1128 818"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 4 L0 8" fill="none" stroke="context-stroke" stroke-width="1.7"/></marker></defs><rect x="0" y="0" width="1128" height="818" rx="0" fill="#0a0a0a" stroke="none"/><text x="26" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#f2f2f2" text-anchor="start"><tspan x="26" dy="0">Your environment</tspan></text><text x="26" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="26" dy="0">Owns the user experience</tspan></text><text x="595" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#75f58b" text-anchor="start"><tspan x="595" dy="0">Namify platform</tspan></text><text x="595" y="63" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="595" dy="0">Registration and compliance</tspan></text><rect x="26" y="77" width="406" height="385" rx="5" fill="#111111" stroke="none"/><rect x="595" y="77" width="406" height="475" rx="5" fill="#0c150e" stroke="none"/><rect x="36" y="87" width="386" height="80" rx="5" fill="#131313" stroke="#191919"/><text x="50" y="117" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="50" dy="0">Your backend</tspan></text><text x="50" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="50" dy="0">Holds the Namify API key and makes every server-side call</tspan></text><rect x="36" y="177" width="386" height="80" rx="5" fill="#131313" stroke="#191919"/><text x="50" y="207" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="50" dy="0">Your datastore</tspan></text><text x="50" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="50" dy="0">Maps customer_id and order_id to your user records</tspan></text><rect x="36" y="267" width="386" height="80" rx="5" fill="#131313" stroke="#191919"/><text x="50" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="50" dy="0">Search &amp; selection UI</tspan></text><text x="50" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="50" dy="0">Search field, pricing and domain selection</tspan></text><rect x="36" y="357" width="386" height="96" rx="5" fill="#131313" stroke="#191919"/><text x="50" y="387" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="50" dy="0">Checkout &amp; card capture</tspan></text><text x="50" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="50" dy="0">Collect payment (paid domains) or tokenize the payment</tspan><tspan x="50" dy="17">card (free domains) before registration.</tspan></text><rect x="36" y="592" width="386" height="96" rx="5" fill="#131313" stroke="#191919"/><text x="50" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="50" dy="0">Your payment provider</tspan></text><text x="50" y="649" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="50" dy="0">Processes the card through your existing payment</tspan><tspan x="50" dy="17">setup - Namify is not involved</tspan></text><rect x="605" y="87" width="386" height="80" rx="5" fill="#0c170e" stroke="#17371c"/><text x="619" y="117" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="619" dy="0">API Gateway</tspan></text><text x="619" y="144" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">Validates your API key and routes every request</tspan></text><rect x="605" y="177" width="386" height="80" rx="5" fill="#0c170e" stroke="#17371c"/><text x="619" y="207" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="619" dy="0">Domain search service</tspan></text><text x="619" y="234" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">MetaSearch - availability, pricing and AI suggestions</tspan></text><rect x="605" y="267" width="386" height="96" rx="5" fill="#0c170e" stroke="#17371c"/><text x="619" y="297" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="619" dy="0">User &amp; registrant service</tspan></text><text x="619" y="324" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">Creates the account, issues customer_id, holds</tspan><tspan x="619" dy="17">the contacts</tspan></text><rect x="605" y="373" width="386" height="80" rx="5" fill="#0c170e" stroke="#17371c"/><text x="619" y="403" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="619" dy="0">Registration service</tspan></text><text x="619" y="430" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">Registers the domain and issues order_id</tspan></text><rect x="605" y="463" width="386" height="80" rx="5" fill="#0c170e" stroke="#17371c"/><text x="619" y="493" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#75f58b" text-anchor="start"><tspan x="619" dy="0">Compliance service</tspan></text><text x="619" y="520" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">*RAA verification and lifecycle notifications</tspan></text><rect x="605" y="592" width="386" height="96" rx="5" fill="#100b0b" stroke="#3b1b17"/><text x="619" y="622" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ff9478" text-anchor="start"><tspan x="619" dy="0">Registration Failed</tspan></text><text x="619" y="649" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">Registration failed or the domain was no longer available.</tspan></text><rect x="605" y="698" width="386" height="80" rx="5" fill="#131313" stroke="#191919"/><text x="619" y="728" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#f2f2f2" text-anchor="start"><tspan x="619" dy="0">Domain deactivated</tspan></text><text x="619" y="755" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#858585" text-anchor="start"><tspan x="619" dy="0">*RAA verification not completed within 14 days</tspan></text><path d="M422 127 H604" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M224 453 V510" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="224" y="527" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#dddddd" text-anchor="middle"><tspan x="224" dy="0">Card goes to your processor, never to Namify</tspan></text><path d="M224 535 V591" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M991 410 H1073 Q1094 410 1094 431 V616 Q1094 637 1073 637 H992" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/><path d="M991 503 H1035 Q1056 503 1056 524 V718 Q1056 739 1035 739 H992" fill="none" stroke="#606060" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow)"/></svg>